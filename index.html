<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MIENRA - Démo fonctionnelle</title>
  <style>
    :root{--blue:#0f2f5f;--blue2:#123f7a;--green:#1f9d55;--orange:#b45309;--red:#b91c1c;--bg:#f4f7fb;--dark:#111827;--muted:#6b7280;--line:#e5e7eb;--white:#fff}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--dark)}
    .app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}.side{background:var(--blue);color:white;padding:18px;position:sticky;top:0;height:100vh;overflow:auto}.brand{font-size:28px;font-weight:900;margin-bottom:4px}.tag{font-size:12px;opacity:.8;margin-bottom:18px}.user{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:12px;margin-bottom:16px}.nav button{width:100%;padding:12px 14px;border:0;border-radius:10px;margin:4px 0;text-align:left;background:transparent;color:white;cursor:pointer;font-weight:700}.nav button:hover,.nav button.active{background:rgba(255,255,255,.16)}
    .main{padding:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:18px}.top h1{margin:0;color:var(--blue);font-size:26px}.pill{background:white;border:1px solid var(--line);padding:9px 12px;border-radius:999px;color:var(--muted);font-size:13px}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:16px;box-shadow:0 8px 26px rgba(15,47,95,.06)}
    .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat{background:white;border:1px solid var(--line);border-radius:16px;padding:16px}.stat b{display:block;color:var(--blue);font-size:27px;margin-bottom:4px}.stat span{color:var(--muted);font-size:13px}.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
    label{font-size:13px;font-weight:700;color:#374151;margin-bottom:5px;display:block}input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:white;font-size:14px}textarea{min-height:84px}.form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{border:0;border-radius:10px;padding:10px 13px;cursor:pointer;font-weight:800}.primary{background:var(--green);color:white}.secondary{background:var(--blue);color:white}.light{background:#eef2ff;color:var(--blue)}.warn{background:#fff7ed;color:#9a3412}.danger{background:#fee2e2;color:var(--red)}
    table{width:100%;border-collapse:collapse;margin-top:12px;background:white;border-radius:12px;overflow:hidden}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left;font-size:13px;vertical-align:top}th{background:#f3f6fb;color:var(--blue)}.ok{color:var(--green);font-weight:800}.bad{color:var(--red);font-weight:800}.mid{color:var(--orange);font-weight:800}.right{text-align:right}.small{font-size:12px;color:var(--muted)}.hide{display:none}.notice{padding:12px;border-radius:12px;background:#eff6ff;border:1px solid #bfdbfe;color:#1e3a8a;margin-bottom:12px}.receipt{border:1px dashed #9ca3af;border-radius:14px;padding:16px;background:#fff;margin-top:12px}.receipt h2{text-align:center;margin:0;color:var(--blue)}
    @media(max-width:900px){.app{grid-template-columns:1fr}.side{height:auto;position:relative}.grid,.two,.three,.form-grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}table{display:block;overflow-x:auto;white-space:nowrap}}
    @media print{.side,.top,.btns,.no-print{display:none!important}.app{display:block}.main{padding:0}.card{box-shadow:none;border:0}.print-only{display:block!important}}
  </style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">MIENRA</div>
    <div class="tag">Démo web fonctionnelle - GitHub Pages</div>
    <div class="user"><b id="schoolNameSide">École Démo MIENRA</b><br><span class="small" style="color:#dbeafe">Gestion inscriptions & paiements</span></div>
    <div class="nav" id="nav"></div>
  </aside>
  <main class="main">
    <div class="top"><h1 id="pageTitle">Tableau de bord</h1><div class="pill">Données sauvegardées dans ce navigateur</div></div>
    <div id="view"></div>
  </main>
</div>
<script>
const STORAGE='mienra_demo_v2';
const fmt=n=>(Number(n)||0).toLocaleString('fr-FR')+' FCFA';
const today=()=>new Date().toISOString().slice(0,10);
const uid=p=>p+'-'+Math.random().toString(36).slice(2,8).toUpperCase();
const modules=[['dashboard','Tableau de bord'],['eleves','Élèves'],['inscriptions','Inscriptions'],['paiements','Paiements'],['recus','Reçus'],['impayes','Impayés'],['rapports','Rapports'],['utilisateurs','Utilisateurs'],['parametres','Paramètres'],['sauvegardes','Sauvegardes']];
let state=load(); let current='dashboard'; let editing=null; let lastReceipt=null;
function seed(){return {school:{name:'Groupe Scolaire MIENRA',code:'GSM',phone:'+225 07 00 00 00 00',address:'Abidjan, Côte d\'Ivoire',year:'2026-2027'},classes:['CP1','CP2','CE1','CE2','CM1','CM2','6e','5e','4e','3e'],users:[{id:uid('USR'),name:'Administrateur',login:'admin',role:'Administrateur',active:true},{id:uid('USR'),name:'Secrétaire',login:'secretaire',role:'Secrétaire',active:true}],students:[{id:uid('ELV'),mat:'GSM-2026-0001',nom:'Aka Mireille',genre:'F',classe:'6e',parent:'Aka Paul',contact:'0700000001',date:today()},{id:uid('ELV'),mat:'GSM-2026-0002',nom:'Kouadio Jean',genre:'M',classe:'CM2',parent:'Kouadio Anne',contact:'0700000002',date:today()},{id:uid('ELV'),mat:'GSM-2026-0003',nom:'Traoré Aminata',genre:'F',classe:'4e',parent:'Traoré Moussa',contact:'0700000003',date:today()}],enrollments:[],payments:[],logs:[]}}
function load(){try{return JSON.parse(localStorage.getItem(STORAGE))||seed()}catch(e){return seed()}}
function save(){localStorage.setItem(STORAGE,JSON.stringify(state))}
function log(a){state.logs.unshift({date:new Date().toLocaleString('fr-FR'),action:a}); state.logs=state.logs.slice(0,80); save()}
function init(){if(!state.enrollments.length){state.students.forEach((s,i)=>state.enrollments.push({id:uid('INS'),studentId:s.id,year:state.school.year,classe:s.classe,amount:[180000,150000,200000][i],date:today(),status:'Validée'})); state.payments.push({id:uid('PAY'),studentId:state.students[0].id,enrollmentId:state.enrollments[0].id,amount:180000,mode:'Espèces',date:today(),note:'Paiement complet'}); state.payments.push({id:uid('PAY'),studentId:state.students[1].id,enrollmentId:state.enrollments[1].id,amount:100000,mode:'Mobile Money',date:today(),note:'Premier versement'}); save()}}
function renderNav(){document.getElementById('nav').innerHTML=modules.map(m=>`<button class="${current==m[0]?'active':''}" onclick="go('${m[0]}')">${m[1]}</button>`).join('')}
function go(m){current=m; editing=null; document.getElementById('pageTitle').textContent=modules.find(x=>x[0]==m)[1]; renderNav(); render()}
function student(id){return state.students.find(s=>s.id==id)||{nom:'Inconnu',mat:'-'}}
function due(id){return state.enrollments.filter(e=>e.studentId==id).reduce((a,b)=>a+Number(b.amount),0)}
function paid(id){return state.payments.filter(p=>p.studentId==id).reduce((a,b)=>a+Number(b.amount),0)}
function balance(id){return due(id)-paid(id)}
function status(id){let b=balance(id),d=due(id); if(d<=0)return '<span class="mid">Non inscrit</span>'; if(b<=0)return '<span class="ok">Soldé</span>'; if(paid(id)>0)return '<span class="mid">Partiel</span>'; return '<span class="bad">Impayé</span>'}
function render(){document.getElementById('schoolNameSide').textContent=state.school.name; ({dashboard,eleves,inscriptions,paiements,recus,impayes,rapports,utilisateurs,parametres,sauvegardes}[current])()}
function dashboard(){let total=state.students.length, exp=state.enrollments.reduce((a,b)=>a+Number(b.amount),0), enc=state.payments.reduce((a,b)=>a+Number(b.amount),0), bal=exp-enc; view.innerHTML=`<div class="grid"><div class="stat"><b>${total}</b><span>Élèves</span></div><div class="stat"><b>${fmt(exp)}</b><span>Montant attendu</span></div><div class="stat"><b>${fmt(enc)}</b><span>Montant encaissé</span></div><div class="stat"><b>${fmt(bal)}</b><span>Reste à payer</span></div></div><div class="two"><div class="card"><h2>Situation par classe</h2>${classTable()}</div><div class="card"><h2>Dernières activités</h2>${logsTable()}</div></div>`}
function classTable(){let rows=state.classes.map(c=>{let ids=state.students.filter(s=>s.classe==c).map(s=>s.id),d=ids.reduce((a,id)=>a+due(id),0),p=ids.reduce((a,id)=>a+paid(id),0); return `<tr><td>${c}</td><td>${ids.length}</td><td>${fmt(d)}</td><td>${fmt(p)}</td><td>${fmt(d-p)}</td></tr>`}).join(''); return `<table><tr><th>Classe</th><th>Élèves</th><th>Attendu</th><th>Payé</th><th>Reste</th></tr>${rows}</table>`}
function logsTable(){return `<table><tr><th>Date</th><th>Action</th></tr>${state.logs.slice(0,8).map(l=>`<tr><td>${l.date}</td><td>${l.action}</td></tr>`).join('')||'<tr><td colspan="2">Aucune activité récente</td></tr>'}</table>`}
function eleves(){let s=editing?state.students.find(x=>x.id==editing):{}; view.innerHTML=`<div class="card"><h2>${editing?'Modifier':'Ajouter'} un élève</h2><div class="form-grid"><div><label>Nom complet</label><input id="nom" value="${s?.nom||''}"></div><div><label>Genre</label><select id="genre"><option ${s?.genre=='M'?'selected':''}>M</option><option ${s?.genre=='F'?'selected':''}>F</option></select></div><div><label>Classe</label><select id="classe">${state.classes.map(c=>`<option ${s?.classe==c?'selected':''}>${c}</option>`).join('')}</select></div><div><label>Parent/Tuteur</label><input id="parent" value="${s?.parent||''}"></div><div><label>Contact parent</label><input id="contact" value="${s?.contact||''}"></div><div><label>Date inscription</label><input type="date" id="date" value="${s?.date||today()}"></div></div><div class="btns"><button class="btn primary" onclick="saveStudent()">Enregistrer l'élève</button>${editing?'<button class="btn light" onclick="editing=null;eleves()">Annuler</button>':''}</div></div><div class="card"><h2>Liste des élèves</h2>${studentsTable()}</div>`}
function studentsTable(){return `<table><tr><th>Matricule</th><th>Nom</th><th>Genre</th><th>Classe</th><th>Parent</th><th>Situation</th><th>Actions</th></tr>${state.students.map(s=>`<tr><td>${s.mat}</td><td>${s.nom}</td><td>${s.genre}</td><td>${s.classe}</td><td>${s.parent}<br><span class="small">${s.contact}</span></td><td>${status(s.id)}<br><span class="small">Reste: ${fmt(balance(s.id))}</span></td><td><button class="btn light" onclick="editStudent('${s.id}')">Modifier</button> <button class="btn danger" onclick="delStudent('${s.id}')">Supprimer</button></td></tr>`).join('')}</table>`}
function saveStudent(){let nom=val('nom'); if(!nom)return alert('Nom obligatoire'); if(editing){let s=state.students.find(x=>x.id==editing); Object.assign(s,{nom,genre:val('genre'),classe:val('classe'),parent:val('parent'),contact:val('contact'),date:val('date')}); log('Élève modifié : '+nom)}else{let n=String(state.students.length+1).padStart(4,'0'); state.students.push({id:uid('ELV'),mat:`${state.school.code}-2026-${n}`,nom,genre:val('genre'),classe:val('classe'),parent:val('parent'),contact:val('contact'),date:val('date')}); log('Élève ajouté : '+nom)} editing=null; save(); eleves()}
function editStudent(id){editing=id; eleves()} function delStudent(id){if(confirm('Supprimer cet élève et ses données liées ?')){state.students=state.students.filter(s=>s.id!=id); state.enrollments=state.enrollments.filter(e=>e.studentId!=id); state.payments=state.payments.filter(p=>p.studentId!=id); log('Élève supprimé'); save(); eleves()}}
function inscriptions(){view.innerHTML=`<div class="card"><h2>Nouvelle inscription</h2><div class="form-grid"><div><label>Élève</label><select id="sid">${state.students.map(s=>`<option value="${s.id}">${s.nom} - ${s.mat}</option>`).join('')}</select></div><div><label>Classe</label><select id="iclass">${state.classes.map(c=>`<option>${c}</option>`).join('')}</select></div><div><label>Année scolaire</label><input id="iyear" value="${state.school.year}"></div><div><label>Montant attendu</label><input id="iamount" type="number" value="150000"></div><div><label>Date</label><input id="idate" type="date" value="${today()}"></div></div><div class="btns"><button class="btn primary" onclick="saveEnrollment()">Valider l'inscription</button></div></div><div class="card"><h2>Inscriptions enregistrées</h2>${enrollTable()}</div>`}
function enrollTable(){return `<table><tr><th>Élève</th><th>Classe</th><th>Année</th><th>Montant</th><th>Date</th><th>Statut</th><th>Action</th></tr>${state.enrollments.map(e=>`<tr><td>${student(e.studentId).nom}<br><span class="small">${student(e.studentId).mat}</span></td><td>${e.classe}</td><td>${e.year}</td><td>${fmt(e.amount)}</td><td>${e.date}</td><td class="ok">${e.status}</td><td><button class="btn danger" onclick="delEnrollment('${e.id}')">Supprimer</button></td></tr>`).join('')}</table>`}
function saveEnrollment(){let e={id:uid('INS'),studentId:val('sid'),classe:val('iclass'),year:val('iyear'),amount:Number(val('iamount')),date:val('idate'),status:'Validée'}; state.enrollments.push(e); let s=state.students.find(x=>x.id==e.studentId); if(s)s.classe=e.classe; log('Inscription validée : '+student(e.studentId).nom); save(); inscriptions()} function delEnrollment(id){state.enrollments=state.enrollments.filter(e=>e.id!=id); log('Inscription supprimée'); save(); inscriptions()}
function paiements(){let sid=state.students[0]?.id||''; view.innerHTML=`<div class="card"><h2>Nouveau paiement</h2><div class="form-grid"><div><label>Élève</label><select id="psid" onchange="refreshPayInfo()">${state.students.map(s=>`<option value="${s.id}">${s.nom} - reste ${fmt(balance(s.id))}</option>`).join('')}</select></div><div><label>Montant payé</label><input id="pamount" type="number" value="50000"></div><div><label>Mode de paiement</label><select id="pmode"><option>Espèces</option><option>Mobile Money</option><option>Chèque</option><option>Virement</option></select></div><div><label>Date</label><input id="pdate" type="date" value="${today()}"></div><div><label>Observation</label><input id="pnote" value="Versement frais scolaires"></div></div><div class="notice" id="payinfo"></div><div class="btns"><button class="btn primary" onclick="savePayment()">Enregistrer paiement</button></div></div><div class="card"><h2>Historique des paiements</h2>${paymentsTable()}</div>`; refreshPayInfo()}
function refreshPayInfo(){let id=val('psid'); let info=document.getElementById('payinfo'); if(info) info.innerHTML=`Situation actuelle : attendu ${fmt(due(id))}, payé ${fmt(paid(id))}, reste ${fmt(balance(id))}.`}
function paymentsTable(){return `<table><tr><th>Reçu</th><th>Élève</th><th>Montant</th><th>Mode</th><th>Date</th><th>Note</th><th>Action</th></tr>${state.payments.map(p=>`<tr><td>${p.id}</td><td>${student(p.studentId).nom}<br><span class="small">${student(p.studentId).mat}</span></td><td>${fmt(p.amount)}</td><td>${p.mode}</td><td>${p.date}</td><td>${p.note||''}</td><td><button class="btn light" onclick="makeReceipt('${p.id}')">Reçu</button> <button class="btn danger" onclick="delPayment('${p.id}')">Supprimer</button></td></tr>`).join('')}</table>`}
function savePayment(){let sid=val('psid'), e=state.enrollments.find(x=>x.studentId==sid); let p={id:uid('REC'),studentId:sid,enrollmentId:e?.id||'',amount:Number(val('pamount')),mode:val('pmode'),date:val('pdate'),note:val('pnote')}; if(p.amount<=0)return alert('Montant invalide'); state.payments.unshift(p); lastReceipt=p.id; log('Paiement enregistré : '+student(sid).nom+' - '+fmt(p.amount)); save(); makeReceipt(p.id)} function delPayment(id){state.payments=state.payments.filter(p=>p.id!=id); log('Paiement supprimé'); save(); paiements()}
function makeReceipt(id){lastReceipt=id; current='recus'; renderNav(); recus()}
function recus(){let p=state.payments.find(x=>x.id==lastReceipt)||state.payments[0]; if(!p){view.innerHTML='<div class="card">Aucun paiement enregistré.</div>';return} let s=student(p.studentId); view.innerHTML=`<div class="card"><h2>Reçu de paiement</h2><div class="receipt"><h2>${state.school.name}</h2><p style="text-align:center">${state.school.address} | ${state.school.phone}</p><hr><p><b>N° reçu :</b> ${p.id}</p><p><b>Date :</b> ${p.date}</p><p><b>Élève :</b> ${s.nom} (${s.mat})</p><p><b>Classe :</b> ${s.classe}</p><p><b>Montant payé :</b> ${fmt(p.amount)}</p><p><b>Mode :</b> ${p.mode}</p><p><b>Reste à payer après opération :</b> ${fmt(balance(s.id))}</p><p><b>Observation :</b> ${p.note||'-'}</p><br><p>Signature école : ____________________</p></div><div class="btns"><button class="btn secondary" onclick="window.print()">Imprimer / PDF</button><button class="btn light" onclick="paiements();current='paiements';renderNav()">Retour paiements</button></div></div>`}
function impayes(){let rows=state.students.filter(s=>balance(s.id)>0).sort((a,b)=>balance(b.id)-balance(a.id)); view.innerHTML=`<div class="card"><h2>Élèves avec reste à payer</h2><div class="notice">Total impayés : <b>${fmt(rows.reduce((a,s)=>a+balance(s.id),0))}</b> pour ${rows.length} élève(s).</div><table><tr><th>Élève</th><th>Classe</th><th>Attendu</th><th>Payé</th><th>Reste</th><th>Contact parent</th></tr>${rows.map(s=>`<tr><td>${s.nom}<br><span class="small">${s.mat}</span></td><td>${s.classe}</td><td>${fmt(due(s.id))}</td><td>${fmt(paid(s.id))}</td><td class="bad">${fmt(balance(s.id))}</td><td>${s.parent}<br>${s.contact}</td></tr>`).join('')}</table></div>`}
function rapports(){let exp=state.enrollments.reduce((a,b)=>a+Number(b.amount),0), enc=state.payments.reduce((a,b)=>a+Number(b.amount),0); view.innerHTML=`<div class="card"><h2>Rapports financiers</h2><div class="grid"><div class="stat"><b>${fmt(exp)}</b><span>Total attendu</span></div><div class="stat"><b>${fmt(enc)}</b><span>Total encaissé</span></div><div class="stat"><b>${fmt(exp-enc)}</b><span>Total impayé</span></div><div class="stat"><b>${exp?Math.round(enc/exp*100):0}%</b><span>Taux de paiement</span></div></div><div class="btns"><button class="btn secondary" onclick="exportCSV('eleves')">Exporter élèves CSV</button><button class="btn secondary" onclick="exportCSV('paiements')">Exporter paiements CSV</button><button class="btn light" onclick="window.print()">Imprimer rapport</button></div></div><div class="card"><h2>Rapport par classe</h2>${classTable()}</div>`}
function utilisateurs(){view.innerHTML=`<div class="card"><h2>Ajouter utilisateur</h2><div class="form-grid"><div><label>Nom</label><input id="uname"></div><div><label>Login</label><input id="ulogin"></div><div><label>Rôle</label><select id="urole"><option>Administrateur</option><option>Directeur</option><option>Secrétaire</option><option>Comptable</option></select></div></div><div class="btns"><button class="btn primary" onclick="addUser()">Ajouter</button></div></div><div class="card"><h2>Utilisateurs</h2><table><tr><th>Nom</th><th>Login</th><th>Rôle</th><th>Statut</th><th>Action</th></tr>${state.users.map(u=>`<tr><td>${u.name}</td><td>${u.login}</td><td>${u.role}</td><td>${u.active?'Actif':'Inactif'}</td><td><button class="btn light" onclick="toggleUser('${u.id}')">Activer/Désactiver</button></td></tr>`).join('')}</table></div>`}
function addUser(){state.users.push({id:uid('USR'),name:val('uname'),login:val('ulogin'),role:val('urole'),active:true}); log('Utilisateur ajouté'); save(); utilisateurs()} function toggleUser(id){let u=state.users.find(x=>x.id==id); u.active=!u.active; log('Statut utilisateur modifié'); save(); utilisateurs()}
function parametres(){view.innerHTML=`<div class="card"><h2>Paramètres de l'école</h2><div class="form-grid"><div><label>Nom école</label><input id="sname" value="${state.school.name}"></div><div><label>Code établissement</label><input id="scode" value="${state.school.code}"></div><div><label>Année scolaire</label><input id="syear" value="${state.school.year}"></div><div><label>Téléphone</label><input id="sphone" value="${state.school.phone}"></div><div><label>Adresse</label><input id="saddress" value="${state.school.address}"></div><div><label>Classes, séparées par virgule</label><input id="sclasses" value="${state.classes.join(', ')}"></div></div><div class="btns"><button class="btn primary" onclick="saveSettings()">Enregistrer paramètres</button></div></div>`}
function saveSettings(){state.school={name:val('sname'),code:val('scode'),year:val('syear'),phone:val('sphone'),address:val('saddress')}; state.classes=val('sclasses').split(',').map(x=>x.trim()).filter(Boolean); log('Paramètres modifiés'); save(); parametres()}
function sauvegardes(){view.innerHTML=`<div class="card"><h2>Sauvegardes</h2><p>Les données sont enregistrées dans le navigateur. Tu peux exporter/importer une sauvegarde JSON.</p><div class="btns"><button class="btn secondary" onclick="downloadJSON()">Télécharger sauvegarde JSON</button><button class="btn warn" onclick="resetDemo()">Réinitialiser démo</button></div><br><label>Importer une sauvegarde JSON</label><input type="file" accept=".json" onchange="importJSON(this)"></div>`}
function exportCSV(type){let rows=type=='eleves'?[['matricule','nom','genre','classe','parent','contact','attendu','paye','reste'],...state.students.map(s=>[s.mat,s.nom,s.genre,s.classe,s.parent,s.contact,due(s.id),paid(s.id),balance(s.id)])]:[['recu','eleve','matricule','montant','mode','date','note'],...state.payments.map(p=>[p.id,student(p.studentId).nom,student(p.studentId).mat,p.amount,p.mode,p.date,p.note])]; let csv=rows.map(r=>r.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(';')).join('\n'); download(type+'.csv',csv,'text/csv')}
function downloadJSON(){download('mienra-sauvegarde.json',JSON.stringify(state,null,2),'application/json')} function download(name,content,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;a.click()} function importJSON(input){let f=input.files[0]; if(!f)return; let r=new FileReader(); r.onload=()=>{try{state=JSON.parse(r.result); save(); log('Sauvegarde importée'); dashboard();current='dashboard';renderNav()}catch(e){alert('Fichier invalide')}}; r.readAsText(f)} function resetDemo(){if(confirm('Réinitialiser toutes les données de cette démo ?')){state=seed(); init(); log('Démo réinitialisée'); save(); go('dashboard')}}
function val(id){return document.getElementById(id)?.value?.trim()||''}
init(); renderNav(); render();
</script>
</body>
</html>
