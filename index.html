  <div id="root"></div>
  <!-- SDK Supabase auto-hébergé (aucune dépendance CDN au chargement) : l'app
       reste installable et fonctionne hors ligne sans requête externe. -->
  <script src="assets/vendor/supabase-js-2.110.7.min.js?v=20260716-vendored"></script>
  <script>
    // Filet de secours : uniquement si le bundle local n'a pas pu se charger
    // (fichier absent ou corrompu), on récupère la lib depuis le CDN. En
    // fonctionnement normal, aucune requête externe n'est émise.
    if (typeof window.supabase === "undefined" || typeof window.supabase.createClient !== "function") {
      var supabaseFallback = document.createElement("script");
      supabaseFallback.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";
      document.head.appendChild(supabaseFallback);
    }
  </script>

  <script>
    // Enregistre le service worker (mode hors ligne). Silencieux si non
    // supporté ou en cas d'échec : l'app fonctionne exactement comme avant.
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js").catch(function (e) {
          console.warn("Service worker non enregistré :", e && e.message);
        });
      });
    }
  </script>
