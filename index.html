<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MIENRA - Démo complète</title>
  <style>
    :root{--blue:#0f2f5f;--blue2:#123f7a;--green:#1f9d55;--orange:#b45309;--red:#b91c1c;--bg:#f4f7fb;--dark:#111827;--muted:#6b7280;--line:#e5e7eb;--white:#fff;--soft:#f8fafc}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--dark)}
    .login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,var(--blue),#072047)}.login-card{width:100%;max-width:430px;background:white;border-radius:22px;padding:26px;box-shadow:0 25px 80px rgba(0,0,0,.3)}.login-card h1{margin:0;color:var(--blue);font-size:36px}.login-card p{color:var(--muted)}
    .app{display:grid;grid-template-columns:270px 1fr;min-height:100vh}.side{background:var(--blue);color:white;padding:18px;position:sticky;top:0;height:100vh;overflow:auto}.brand{font-size:30px;font-weight:900;margin-bottom:4px}.tag{font-size:12px;opacity:.85;margin-bottom:18px}.user{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:12px;margin-bottom:16px}.nav button{width:100%;padding:12px 14px;border:0;border-radius:10px;margin:4px 0;text-align:left;background:transparent;color:white;cursor:pointer;font-weight:700}.nav button:hover,.nav button.active{background:rgba(255,255,255,.16)}
    .main{padding:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:18px}.top h1{margin:0;color:var(--blue);font-size:26px}.pill{background:white;border:1px solid var(--line);padding:9px 12px;border-radius:999px;color:var(--muted);font-size:13px}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:16px;box-shadow:0 8px 26px rgba(15,47,95,.06)}
    .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{background:white;border:1px solid var(--line);border-radius:16px;padding:16px}.stat b{display:block;color:var(--blue);font-size:25px;margin-bottom:4px}.stat span{color:var(--muted);font-size:13px}
    label{font-size:13px;font-weight:700;color:#374151;margin-bottom:5px;display:block}input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:white;font-size:14px}textarea{min-height:84px}.form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.form-grid.two-col{grid-template-columns:repeat(2,1fr)}
    .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{border:0;border-radius:10px;padding:10px 13px;cursor:pointer;font-weight:800}.primary{background:var(--green);color:white}.secondary{background:var(--blue);color:white}.light{background:#eef2ff;color:var(--blue)}.warn{background:#fff7ed;color:#9a3412}.danger{background:#fee2e2;color:var(--red)}.muted{background:#f3f4f6;color:#374151}
    table{width:100%;border-collapse:collapse;margin-top:12px;background:white;border-radius:12px;overflow:hidden}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left;font-size:13px;vertical-align:top}th{background:#f3f6fb;color:var(--blue)}.ok{color:var(--green);font-weight:800}.bad{color:var(--red);font-weight:800}.mid{color:var(--orange);font-weight:800}.small{font-size:12px;color:var(--muted)}.notice{padding:12px;border-radius:12px;background:#eff6ff;border:1px solid #bfdbfe;color:#1e3a8a;margin-bottom:12px}.receipt{border:1px dashed #9ca3af;border-radius:14px;padding:18px;background:#fff;margin-top:12px}.receipt h2{text-align:center;margin:0;color:var(--blue)}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.tabs button{border:1px solid var(--line);background:white;border-radius:999px;padding:9px 12px;cursor:pointer;font-weight:700}.tabs button.active{background:var(--blue);color:white}.logo-box{width:70px;height:70px;border-radius:14px;background:var(--blue);color:white;display:grid;place-items:center;font-weight:900;margin:auto}.progress{height:10px;background:#e5e7eb;border-radius:999px;overflow:hidden}.bar{height:100%;background:var(--green)}
    @media(max-width:950px){.app{grid-template-columns:1fr}.side{height:auto;position:relative}.grid,.two,.three,.form-grid,.form-grid.two-col{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}table{display:block;overflow-x:auto;white-space:nowrap}}
    @media print{.side,.top,.btns,.tabs,.no-print{display:none!important}.app{display:block}.main{padding:0}.card{box-shadow:none;border:0}.receipt{border:0}}
  </style>
</head>
<body>
<div id="root"></div>
<script>
const STORAGE='mienra_demo_full_v1';
const fmt=n=>(Number(n)||0).toLocaleString('fr-FR')+' FCFA';
const today=()=>new Date().toISOString().slice(0,10);
const uid=p=>p+'-'+Math.random().toString(36).slice(2,8).toUpperCase();
const root=document.getElementById('root');
let current='dashboard', tab='general', editing=null, lastReceipt=null, session=null;
const nav=[['dashboard','Tableau de bord'],['eleves','Élèves'],['inscriptions','Inscriptions'],['paiements','Paiements'],['recus','Reçus'],['impayes','Impayés'],['rapports','Rapports'],['classes','Classes & frais'],['utilisateurs','Utilisateurs'],['journal','Journal'],['parametres','Paramètres'],['sauvegardes','Sauvegardes']];
function seed(){return {school:{name:'Groupe Scolaire MIENRA',code:'GSM',phone:'+225 07 00 00 00 00',email:'contact@mienra.ci',address:'Abidjan, Côte d’Ivoire',year:'2026-2027',currency:'FCFA',receiptPrefix:'REC',matriculeYear:'2026',logoText:'M',director:'Directeur de l’école',receiptFooter:'Merci pour votre paiement. Reçu généré par MIENRA.',theme:'Bleu / Vert',autoBackup:true,keepBackups:10},classes:[{name:'CP1',level:'Primaire',fee:90000},{name:'CP2',level:'Primaire',fee:95000},{name:'CE1',level:'Primaire',fee:100000},{name:'CE2',level:'Primaire',fee:105000},{name:'CM1',level:'Primaire',fee:120000},{name:'CM2',level:'Primaire',fee:130000},{name:'6e',level:'Collège',fee:180000},{name:'5e',level:'Collège',fee:180000},{name:'4e',level:'Collège',fee:200000},{name:'3e',level:'Collège',fee:220000}],years:['2025-2026','2026-2027'],users:[{id:uid('USR'),name:'Administrateur',login:'admin',password:'admin123',role:'Administrateur',active:true},{id:uid('USR'),name:'Directeur',login:'directeur',password:'directeur123',role:'Directeur',active:true},{id:uid('USR'),name:'Secrétaire',login:'secretaire',password:'secretaire123',role:'Secrétaire',active:true}],students:[{id:uid('ELV'),mat:'GSM-2026-0001',nom:'Aka Mireille',genre:'F',birth:'2014-04-12',classe:'6e',parent:'Aka Paul',contact:'0700000001',address:'Yopougon',status:'Actif',date:today()},{id:uid('ELV'),mat:'GSM-2026-0002',nom:'Kouadio Jean',genre:'M',birth:'2015-09-20',classe:'CM2',parent:'Kouadio Anne',contact:'0700000002',address:'Cocody',status:'Actif',date:today()},{id:uid('ELV'),mat:'GSM-2026-0003',nom:'Traoré Aminata',genre:'F',birth:'2012-01-11',classe:'4e',parent:'Traoré Moussa',contact:'0700000003',address:'Abobo',status:'Actif',date:today()}],enrollments:[],payments:[],logs:[],backups:[]}}
let state=load(); init();
function load(){try{return JSON.parse(localStorage.getItem(STORAGE))||seed()}catch(e){return seed()}}
function save(){localStorage.setItem(STORAGE,JSON.stringify(state))}
function log(action){state.logs.unshift({date:new Date().toLocaleString('fr-FR'),user:session?.name||'Système',action}); state.logs=state.logs.slice(0,120); save()}
function init(){if(!state.enrollments.length){state.students.forEach(s=>{let fee=(state.classes.find(c=>c.name==s.classe)||{}).fee||150000; state.enrollments.push({id:uid('INS'),studentId:s.id,year:state.school.year,classe:s.classe,amount:fee,discount:0,date:today(),status:'Validée',note:'Inscription démo'})}); state.payments.push({id:uid('REC'),studentId:state.students[0].id,amount:180000,mode:'Espèces',date:today(),note:'Paiement complet',cashier:'Secrétaire'}); state.payments.push({id:uid('REC'),studentId:state.students[1].id,amount:100000,mode:'Mobile Money',date:today(),note:'Premier versement',cashier:'Secrétaire'}); save()}}
function canWrite(){return !session||['Administrateur','Directeur','Secrétaire','Comptable'].includes(session.role)}
function showLogin(){root.innerHTML=`<div class="login"><div class="login-card"><h1>MIENRA</h1><p>Démo complète de gestion scolaire. Les données sont sauvegardées uniquement dans ce navigateur.</p><label>Identifiant</label><input id="login" value="admin"><br><br><label>Mot de passe</label><input id="pwd" type="password" value="admin123"><div class="btns"><button class="btn primary" onclick="doLogin()">Se connecter</button><button class="btn light" onclick="quickDemo()">Entrer en mode démo</button></div><div class="notice" style="margin-top:14px">Comptes test : admin/admin123, directeur/directeur123, secretaire/secretaire123</div></div></div>`}
function doLogin(){let u=state.users.find(x=>x.login==val('login')&&x.password==val('pwd')&&x.active); if(!u)return alert('Identifiant ou mot de passe incorrect'); session=u; log('Connexion'); drawApp()}
function quickDemo(){session={name:'Visiteur démo',role:'Administrateur',login:'demo'}; drawApp()}
function logout(){session=null; showLogin()}
function drawApp(){root.innerHTML=`<div class="app"><aside class="side"><div class="brand">MIENRA</div><div class="tag">Démo web complète - GitHub Pages</div><div class="user"><b>${state.school.name}</b><br><span class="small" style="color:#dbeafe">${session.name} · ${session.role}</span><br><button class="btn light" style="margin-top:10px" onclick="logout()">Déconnexion</button></div><div class="nav" id="nav"></div></aside><main class="main"><div class="top"><h1 id="pageTitle"></h1><div class="pill">Lien testable · stockage navigateur · sans serveur</div></div><div id="view"></div></main></div>`; renderNav(); go(current)}
function renderNav(){document.getElementById('nav').innerHTML=nav.map(m=>`<button class="${current==m[0]?'active':''}" onclick="go('${m[0]}')">${m[1]}</button>`).join('')}
function go(m){current=m; editing=null; tab='general'; if(document.getElementById('pageTitle'))document.getElementById('pageTitle').textContent=nav.find(x=>x[0]==m)[1]; renderNav(); render()}
function render(){({dashboard,eleves,inscriptions,paiements,recus,impayes,rapports,classes,utilisateurs,journal,parametres,sauvegardes}[current])()}
function val(id){return document.getElementById(id)?.value?.trim()||''}
function classNames(){return state.classes.map(c=>c.name)}
function student(id){return state.students.find(s=>s.id==id)||{nom:'Inconnu',mat:'-',classe:'-'}}
function due(id){return state.enrollments.filter(e=>e.studentId==id).reduce((a,b)=>a+Number(b.amount)-Number(b.discount||0),0)}
function paid(id){return state.payments.filter(p=>p.studentId==id).reduce((a,b)=>a+Number(b.amount),0)}
function balance(id){return due(id)-paid(id)}
function payRate(id){let d=due(id);return d?Math.min(100,Math.round(paid(id)/d*100)):0}
function status(id){let b=balance(id),d=due(id); if(d<=0)return '<span class="mid">Non inscrit</span>'; if(b<=0)return '<span class="ok">Soldé</span>'; if(paid(id)>0)return '<span class="mid">Partiel</span>'; return '<span class="bad">Impayé</span>'}
function dashboard(){let total=state.students.length, exp=state.enrollments.reduce((a,b)=>a+Number(b.amount)-Number(b.discount||0),0), enc=state.payments.reduce((a,b)=>a+Number(b.amount),0), bal=exp-enc, taux=exp?Math.round(enc/exp*100):0; view.innerHTML=`<div class="grid"><div class="stat"><b>${total}</b><span>Élèves</span></div><div class="stat"><b>${fmt(exp)}</b><span>Montant attendu</span></div><div class="stat"><b>${fmt(enc)}</b><span>Montant encaissé</span></div><div class="stat"><b>${taux}%</b><span>Taux de paiement</span></div></div><div class="two"><div class="card"><h2>Situation par classe</h2>${classTable()}</div><div class="card"><h2>Alertes & dernières activités</h2><div class="notice">Reste à recouvrer : <b>${fmt(bal)}</b>. Élèves en retard : <b>${state.students.filter(s=>balance(s.id)>0).length}</b>.</div>${logsTable(8)}</div></div>`}
function classTable(){let rows=state.classes.map(c=>{let ids=state.students.filter(s=>s.classe==c.name).map(s=>s.id),d=ids.reduce((a,id)=>a+due(id),0),p=ids.reduce((a,id)=>a+paid(id),0),r=d-p; return `<tr><td>${c.name}<br><span class="small">${c.level}</span></td><td>${ids.length}</td><td>${fmt(c.fee)}</td><td>${fmt(d)}</td><td>${fmt(p)}</td><td class="${r>0?'bad':'ok'}">${fmt(r)}</td></tr>`}).join(''); return `<table><tr><th>Classe</th><th>Élèves</th><th>Frais/an</th><th>Attendu</th><th>Payé</th><th>Reste</th></tr>${rows}</table>`}
function logsTable(n=20){return `<table><tr><th>Date</th><th>Utilisateur</th><th>Action</th></tr>${state.logs.slice(0,n).map(l=>`<tr><td>${l.date}</td><td>${l.user}</td><td>${l.action}</td></tr>`).join('')||'<tr><td colspan="3">Aucune activité récente</td></tr>'}</table>`}
function eleves(){let s=editing?state.students.find(x=>x.id==editing):{}; view.innerHTML=`<div class="card"><h2>${editing?'Modifier':'Ajouter'} un élève</h2><div class="form-grid"><div><label>Nom complet</label><input id="nom" value="${s?.nom||''}"></div><div><label>Genre</label><select id="genre"><option ${s?.genre=='M'?'selected':''}>M</option><option ${s?.genre=='F'?'selected':''}>F</option></select></div><div><label>Date de naissance</label><input type="date" id="birth" value="${s?.birth||''}"></div><div><label>Classe</label><select id="classe">${classNames().map(c=>`<option ${s?.classe==c?'selected':''}>${c}</option>`).join('')}</select></div><div><label>Parent/Tuteur</label><input id="parent" value="${s?.parent||''}"></div><div><label>Contact parent</label><input id="contact" value="${s?.contact||''}"></div><div><label>Adresse</label><input id="address" value="${s?.address||''}"></div><div><label>Statut</label><select id="estatus"><option ${s?.status=='Actif'?'selected':''}>Actif</option><option ${s?.status=='Inactif'?'selected':''}>Inactif</option><option ${s?.status=='Transféré'?'selected':''}>Transféré</option></select></div><div><label>Date d'entrée</label><input type="date" id="date" value="${s?.date||today()}"></div></div><div class="btns"><button class="btn primary" onclick="saveStudent()">Enregistrer l'élève</button>${editing?'<button class="btn light" onclick="editing=null;eleves()">Annuler</button>':''}</div></div><div class="card"><h2>Liste des élèves</h2>${studentsTable()}</div>`}
function studentsTable(){return `<table><tr><th>Matricule</th><th>Nom</th><th>Classe</th><th>Parent</th><th>Paiement</th><th>Statut</th><th>Actions</th></tr>${state.students.map(s=>`<tr><td>${s.mat}</td><td>${s.nom}<br><span class="small">${s.genre} · né(e) ${s.birth||'-'}</span></td><td>${s.classe}</td><td>${s.parent}<br><span class="small">${s.contact}</span></td><td>${status(s.id)}<div class="progress"><div class="bar" style="width:${payRate(s.id)}%"></div></div><span class="small">${payRate(s.id)}% payé · Reste ${fmt(balance(s.id))}</span></td><td>${s.status}</td><td><button class="btn light" onclick="editStudent('${s.id}')">Modifier</button> <button class="btn secondary" onclick="enrollQuick('${s.id}')">Inscrire</button> <button class="btn danger" onclick="delStudent('${s.id}')">Supprimer</button></td></tr>`).join('')}</table>`}
function saveStudent(){let nom=val('nom'); if(!nom)return alert('Nom obligatoire'); if(editing){let s=state.students.find(x=>x.id==editing); Object.assign(s,{nom,genre:val('genre'),birth:val('birth'),classe:val('classe'),parent:val('parent'),contact:val('contact'),address:val('address'),status:val('estatus'),date:val('date')}); log('Élève modifié : '+nom)}else{let n=String(state.students.length+1).padStart(4,'0'); state.students.push({id:uid('ELV'),mat:`${state.school.code}-${state.school.matriculeYear}-${n}`,nom,genre:val('genre'),birth:val('birth'),classe:val('classe'),parent:val('parent'),contact:val('contact'),address:val('address'),status:val('estatus'),date:val('date')}); log('Élève ajouté : '+nom)} editing=null; save(); eleves()}
function editStudent(id){editing=id; eleves()} function delStudent(id){if(confirm('Supprimer cet élève et toutes ses données liées ?')){state.students=state.students.filter(s=>s.id!=id); state.enrollments=state.enrollments.filter(e=>e.studentId!=id); state.payments=state.payments.filter(p=>p.studentId!=id); log('Élève supprimé'); save(); eleves()}}
function enrollQuick(id){current='inscriptions'; renderNav(); inscriptions(id)}
function inscriptions(pref){view.innerHTML=`<div class="card"><h2>Nouvelle inscription</h2><div class="form-grid"><div><label>Élève</label><select id="sid" onchange="fillFee()">${state.students.map(s=>`<option value="${s.id}" ${pref==s.id?'selected':''}>${s.nom} - ${s.mat}</option>`).join('')}</select></div><div><label>Classe</label><select id="iclass" onchange="fillFee()">${classNames().map(c=>`<option>${c}</option>`).join('')}</select></div><div><label>Année scolaire</label><select id="iyear">${state.years.map(y=>`<option ${y==state.school.year?'selected':''}>${y}</option>`).join('')}</select></div><div><label>Montant attendu</label><input id="iamount" type="number"></div><div><label>Réduction / remise</label><input id="idiscount" type="number" value="0"></div><div><label>Date</label><input id="idate" type="date" value="${today()}"></div><div><label>Observation</label><input id="inote" value="Inscription annuelle"></div></div><div class="btns"><button class="btn primary" onclick="saveEnrollment()">Valider l'inscription</button></div></div><div class="card"><h2>Inscriptions enregistrées</h2>${enrollTable()}</div>`; fillFee()}
function fillFee(){let c=val('iclass'), f=(state.classes.find(x=>x.name==c)||{}).fee||0; let el=document.getElementById('iamount'); if(el&&!el.dataset.touched){el.value=f} }
function enrollTable(){return `<table><tr><th>Élève</th><th>Classe</th><th>Année</th><th>Montant</th><th>Remise</th><th>Net</th><th>Date</th><th>Action</th></tr>${state.enrollments.map(e=>`<tr><td>${student(e.studentId).nom}<br><span class="small">${student(e.studentId).mat}</span></td><td>${e.classe}</td><td>${e.year}</td><td>${fmt(e.amount)}</td><td>${fmt(e.discount||0)}</td><td>${fmt(Number(e.amount)-Number(e.discount||0))}</td><td>${e.date}<br><span class="small">${e.note||''}</span></td><td><button class="btn danger" onclick="delEnrollment('${e.id}')">Supprimer</button></td></tr>`).join('')}</table>`}
function saveEnrollment(){let e={id:uid('INS'),studentId:val('sid'),classe:val('iclass'),year:val('iyear'),amount:Number(val('iamount')),discount:Number(val('idiscount')||0),date:val('idate'),status:'Validée',note:val('inote')}; if(e.amount<=0)return alert('Montant obligatoire'); state.enrollments.push(e); let s=state.students.find(x=>x.id==e.studentId); if(s)s.classe=e.classe; log('Inscription validée : '+student(e.studentId).nom); save(); inscriptions()}
function delEnrollment(id){if(confirm('Supprimer cette inscription ?')){state.enrollments=state.enrollments.filter(e=>e.id!=id); log('Inscription supprimée'); save(); inscriptions()}}
function paiements(pref){view.innerHTML=`<div class="card"><h2>Nouveau paiement</h2><div class="form-grid"><div><label>Élève</label><select id="psid" onchange="refreshPayInfo()">${state.students.map(s=>`<option value="${s.id}" ${pref==s.id?'selected':''}>${s.nom} - reste ${fmt(balance(s.id))}</option>`).join('')}</select></div><div><label>Montant payé</label><input id="pamount" type="number" value="50000"></div><div><label>Mode</label><select id="pmode"><option>Espèces</option><option>Mobile Money</option><option>Chèque</option><option>Virement</option><option>Carte bancaire</option></select></div><div><label>Date</label><input id="pdate" type="date" value="${today()}"></div><div><label>Caissier</label><input id="pcashier" value="${session?.name||''}"></div><div><label>Note</label><input id="pnote" value="Versement frais scolaires"></div></div><div class="notice" id="payinfo"></div><div class="btns"><button class="btn primary" onclick="savePayment()">Enregistrer paiement</button></div></div><div class="card"><h2>Historique des paiements</h2>${paymentsTable()}</div>`; refreshPayInfo()}
function refreshPayInfo(){let id=val('psid'); let info=document.getElementById('payinfo'); if(info)info.innerHTML=`Attendu : <b>${fmt(due(id))}</b> · Payé : <b>${fmt(paid(id))}</b> · Reste : <b>${fmt(balance(id))}</b>`}
function paymentsTable(){return `<table><tr><th>Reçu</th><th>Élève</th><th>Montant</th><th>Mode</th><th>Date</th><th>Caissier</th><th>Action</th></tr>${state.payments.map(p=>`<tr><td>${p.id}</td><td>${student(p.studentId).nom}<br><span class="small">${student(p.studentId).mat}</span></td><td>${fmt(p.amount)}</td><td>${p.mode}</td><td>${p.date}<br><span class="small">${p.note||''}</span></td><td>${p.cashier||''}</td><td><button class="btn light" onclick="makeReceipt('${p.id}')">Reçu</button> <button class="btn danger" onclick="delPayment('${p.id}')">Supprimer</button></td></tr>`).join('')}</table>`}
function savePayment(){let sid=val('psid'), amount=Number(val('pamount')); if(amount<=0)return alert('Montant invalide'); let p={id:state.school.receiptPrefix+'-'+new Date().getFullYear()+'-'+String(state.payments.length+1).padStart(4,'0'),studentId:sid,amount,mode:val('pmode'),date:val('pdate'),note:val('pnote'),cashier:val('pcashier')}; state.payments.unshift(p); lastReceipt=p.id; log('Paiement enregistré : '+student(sid).nom+' - '+fmt(amount)); save(); makeReceipt(p.id)}
function delPayment(id){if(confirm('Supprimer ce paiement ?')){state.payments=state.payments.filter(p=>p.id!=id); log('Paiement supprimé'); save(); paiements()}}
function makeReceipt(id){lastReceipt=id; current='recus'; renderNav(); recus()}
function recus(){let p=state.payments.find(x=>x.id==lastReceipt)||state.payments[0]; if(!p){view.innerHTML='<div class="card">Aucun paiement enregistré.</div>';return} let s=student(p.studentId); view.innerHTML=`<div class="card"><h2>Reçu de paiement</h2><div class="receipt"><div class="logo-box">${state.school.logoText}</div><h2>${state.school.name}</h2><p style="text-align:center">${state.school.address} | ${state.school.phone} | ${state.school.email}</p><hr><div class="two"><div><p><b>N° reçu :</b> ${p.id}</p><p><b>Date :</b> ${p.date}</p><p><b>Élève :</b> ${s.nom}</p><p><b>Matricule :</b> ${s.mat}</p><p><b>Classe :</b> ${s.classe}</p></div><div><p><b>Montant payé :</b> ${fmt(p.amount)}</p><p><b>Mode :</b> ${p.mode}</p><p><b>Total attendu :</b> ${fmt(due(s.id))}</p><p><b>Total payé :</b> ${fmt(paid(s.id))}</p><p><b>Reste :</b> ${fmt(balance(s.id))}</p></div></div><p><b>Observation :</b> ${p.note||'-'}</p><br><div class="two"><p>Caissier : ${p.cashier||session?.name||''}<br><br>Signature : ____________________</p><p>Direction : ${state.school.director}<br><br>Cachet : ____________________</p></div><p style="text-align:center" class="small">${state.school.receiptFooter}</p></div><div class="btns"><button class="btn secondary" onclick="window.print()">Imprimer / Enregistrer en PDF</button><button class="btn light" onclick="current='paiements';renderNav();paiements()">Retour paiements</button></div></div>`}
function impayes(){let rows=state.students.filter(s=>balance(s.id)>0).sort((a,b)=>balance(b.id)-balance(a.id)); view.innerHTML=`<div class="card"><h2>Suivi des impayés</h2><div class="notice">Total impayés : <b>${fmt(rows.reduce((a,s)=>a+balance(s.id),0))}</b> pour ${rows.length} élève(s).</div><table><tr><th>Élève</th><th>Classe</th><th>Attendu</th><th>Payé</th><th>Reste</th><th>Contact</th><th>Action</th></tr>${rows.map(s=>`<tr><td>${s.nom}<br><span class="small">${s.mat}</span></td><td>${s.classe}</td><td>${fmt(due(s.id))}</td><td>${fmt(paid(s.id))}</td><td class="bad">${fmt(balance(s.id))}</td><td>${s.parent}<br>${s.contact}</td><td><button class="btn secondary" onclick="current='paiements';renderNav();paiements('${s.id}')">Payer</button></td></tr>`).join('')}</table></div>`}
function rapports(){let exp=state.enrollments.reduce((a,b)=>a+Number(b.amount)-Number(b.discount||0),0), enc=state.payments.reduce((a,b)=>a+Number(b.amount),0); view.innerHTML=`<div class="card"><h2>Rapports financiers</h2><div class="grid"><div class="stat"><b>${fmt(exp)}</b><span>Total attendu</span></div><div class="stat"><b>${fmt(enc)}</b><span>Total encaissé</span></div><div class="stat"><b>${fmt(exp-enc)}</b><span>Total impayé</span></div><div class="stat"><b>${exp?Math.round(enc/exp*100):0}%</b><span>Taux de paiement</span></div></div><div class="btns"><button class="btn secondary" onclick="exportCSV('eleves')">Exporter élèves CSV</button><button class="btn secondary" onclick="exportCSV('paiements')">Exporter paiements CSV</button><button class="btn secondary" onclick="exportCSV('inscriptions')">Exporter inscriptions CSV</button><button class="btn light" onclick="window.print()">Imprimer rapport</button></div></div><div class="card"><h2>Rapport par classe</h2>${classTable()}</div>`}
function classes(){let c=editing?state.classes.find(x=>x.name==editing):{}; view.innerHTML=`<div class="card"><h2>${editing?'Modifier':'Ajouter'} une classe / frais</h2><div class="form-grid"><div><label>Classe</label><input id="cname" value="${c?.name||''}"></div><div><label>Niveau</label><select id="clevel"><option ${c?.level=='Primaire'?'selected':''}>Primaire</option><option ${c?.level=='Collège'?'selected':''}>Collège</option><option ${c?.level=='Lycée'?'selected':''}>Lycée</option></select></div><div><label>Frais annuels</label><input id="cfee" type="number" value="${c?.fee||100000}"></div></div><div class="btns"><button class="btn primary" onclick="saveClass()">Enregistrer</button>${editing?'<button class="btn light" onclick="editing=null;classes()">Annuler</button>':''}</div></div><div class="card"><h2>Classes et frais</h2><table><tr><th>Classe</th><th>Niveau</th><th>Frais annuels</th><th>Élèves</th><th>Actions</th></tr>${state.classes.map(c=>`<tr><td>${c.name}</td><td>${c.level}</td><td>${fmt(c.fee)}</td><td>${state.students.filter(s=>s.classe==c.name).length}</td><td><button class="btn light" onclick="editing='${c.name}';classes()">Modifier</button> <button class="btn danger" onclick="delClass('${c.name}')">Supprimer</button></td></tr>`).join('')}</table></div>`}
function saveClass(){let name=val('cname'); if(!name)return alert('Nom de classe obligatoire'); if(editing){let c=state.classes.find(x=>x.name==editing); let old=c.name; Object.assign(c,{name,level:val('clevel'),fee:Number(val('cfee'))}); state.students.forEach(s=>{if(s.classe==old)s.classe=name}); state.enrollments.forEach(e=>{if(e.classe==old)e.classe=name}); log('Classe modifiée : '+name)}else{state.classes.push({name,level:val('clevel'),fee:Number(val('cfee'))}); log('Classe ajoutée : '+name)} editing=null; save(); classes()}
function delClass(name){if(confirm('Supprimer cette classe ?')){state.classes=state.classes.filter(c=>c.name!=name); log('Classe supprimée : '+name); save(); classes()}}
function utilisateurs(){let u=editing?state.users.find(x=>x.id==editing):{}; view.innerHTML=`<div class="card"><h2>${editing?'Modifier':'Ajouter'} utilisateur</h2><div class="form-grid"><div><label>Nom</label><input id="uname" value="${u?.name||''}"></div><div><label>Login</label><input id="ulogin" value="${u?.login||''}"></div><div><label>Mot de passe</label><input id="upwd" value="${u?.password||'123456'}"></div><div><label>Rôle</label><select id="urole"><option ${u?.role=='Administrateur'?'selected':''}>Administrateur</option><option ${u?.role=='Directeur'?'selected':''}>Directeur</option><option ${u?.role=='Secrétaire'?'selected':''}>Secrétaire</option><option ${u?.role=='Comptable'?'selected':''}>Comptable</option><option ${u?.role=='Consultation'?'selected':''}>Consultation</option></select></div><div><label>Statut</label><select id="uactive"><option value="true" ${u?.active!==false?'selected':''}>Actif</option><option value="false" ${u?.active===false?'selected':''}>Inactif</option></select></div></div><div class="btns"><button class="btn primary" onclick="saveUser()">Enregistrer</button>${editing?'<button class="btn light" onclick="editing=null;utilisateurs()">Annuler</button>':''}</div></div><div class="card"><h2>Utilisateurs</h2><table><tr><th>Nom</th><th>Login</th><th>Mot de passe test</th><th>Rôle</th><th>Statut</th><th>Actions</th></tr>${state.users.map(u=>`<tr><td>${u.name}</td><td>${u.login}</td><td>${u.password}</td><td>${u.role}</td><td>${u.active?'Actif':'Inactif'}</td><td><button class="btn light" onclick="editing='${u.id}';utilisateurs()">Modifier</button> <button class="btn danger" onclick="delUser('${u.id}')">Supprimer</button></td></tr>`).join('')}</table></div>`}
function saveUser(){let data={name:val('uname'),login:val('ulogin'),password:val('upwd'),role:val('urole'),active:val('uactive')==='true'}; if(!data.name||!data.login)return alert('Nom et login obligatoires'); if(editing){Object.assign(state.users.find(x=>x.id==editing),data); log('Utilisateur modifié : '+data.login)}else{state.users.push({id:uid('USR'),...data}); log('Utilisateur ajouté : '+data.login)} editing=null; save(); utilisateurs()}
function delUser(id){if(confirm('Supprimer cet utilisateur ?')){state.users=state.users.filter(u=>u.id!=id); log('Utilisateur supprimé'); save(); utilisateurs()}}
function journal(){view.innerHTML=`<div class="card"><h2>Journal d'activité</h2><div class="btns"><button class="btn danger" onclick="state.logs=[];save();journal()">Vider le journal</button></div>${logsTable(100)}</div>`}
function parametres(){view.innerHTML=`<div class="tabs"><button class="${tab=='general'?'active':''}" onclick="tab='general';parametres()">École</button><button class="${tab=='recu'?'active':''}" onclick="tab='recu';parametres()">Reçus</button><button class="${tab=='annees'?'active':''}" onclick="tab='annees';parametres()">Années</button><button class="${tab=='options'?'active':''}" onclick="tab='options';parametres()">Options</button></div>${settingsContent()}`}
function settingsContent(){let s=state.school;if(tab=='general')return `<div class="card"><h2>Paramètres de l'école</h2><div class="form-grid"><div><label>Nom école</label><input id="sname" value="${s.name}"></div><div><label>Code établissement</label><input id="scode" value="${s.code}"></div><div><label>Année active</label><select id="syear">${state.years.map(y=>`<option ${y==s.year?'selected':''}>${y}</option>`).join('')}</select></div><div><label>Téléphone</label><input id="sphone" value="${s.phone}"></div><div><label>Email</label><input id="semail" value="${s.email}"></div><div><label>Adresse</label><input id="saddress" value="${s.address}"></div><div><label>Nom du directeur</label><input id="sdirector" value="${s.director}"></div><div><label>Devise</label><input id="scurrency" value="${s.currency}"></div><div><label>Texte logo court</label><input id="slogo" value="${s.logoText}"></div></div><div class="btns"><button class="btn primary" onclick="saveSettingsGeneral()">Enregistrer</button></div></div>`; if(tab=='recu')return `<div class="card"><h2>Paramètres des reçus</h2><div class="form-grid two-col"><div><label>Préfixe reçu</label><input id="rprefix" value="${s.receiptPrefix}"></div><div><label>Année matricule</label><input id="myear" value="${s.matriculeYear}"></div><div style="grid-column:1/-1"><label>Message en bas du reçu</label><textarea id="rfooter">${s.receiptFooter}</textarea></div></div><div class="btns"><button class="btn primary" onclick="saveSettingsReceipt()">Enregistrer</button></div></div>`; if(tab=='annees')return `<div class="card"><h2>Années scolaires</h2><div class="form-grid two-col"><div><label>Nouvelle année</label><input id="newyear" placeholder="2027-2028"></div><div><label>Année active</label><select id="activeyear">${state.years.map(y=>`<option ${y==s.year?'selected':''}>${y}</option>`).join('')}</select></div></div><div class="btns"><button class="btn primary" onclick="addYear()">Ajouter année</button><button class="btn secondary" onclick="state.school.year=val('activeyear');save();log('Année active changée');parametres()">Définir active</button></div><table><tr><th>Année</th><th>Action</th></tr>${state.years.map(y=>`<tr><td>${y}</td><td><button class="btn danger" onclick="delYear('${y}')">Supprimer</button></td></tr>`).join('')}</table></div>`; return `<div class="card"><h2>Options générales</h2><div class="form-grid"><div><label>Thème</label><select id="theme"><option ${s.theme=='Bleu / Vert'?'selected':''}>Bleu / Vert</option><option ${s.theme=='Classique'?'selected':''}>Classique</option></select></div><div><label>Sauvegarde automatique</label><select id="autob"><option value="true" ${s.autoBackup?'selected':''}>Oui</option><option value="false" ${!s.autoBackup?'selected':''}>Non</option></select></div><div><label>Nombre sauvegardes à conserver</label><input id="keepb" type="number" value="${s.keepBackups}"></div></div><div class="btns"><button class="btn primary" onclick="saveOptions()">Enregistrer options</button></div><div class="notice">Ces paramètres sont simulés pour la démo GitHub Pages. En production, ils seraient enregistrés dans une vraie base de données.</div></div>`}
function saveSettingsGeneral(){Object.assign(state.school,{name:val('sname'),code:val('scode'),year:val('syear'),phone:val('sphone'),email:val('semail'),address:val('saddress'),director:val('sdirector'),currency:val('scurrency'),logoText:val('slogo')}); log('Paramètres école modifiés'); save(); drawApp()}
function saveSettingsReceipt(){Object.assign(state.school,{receiptPrefix:val('rprefix'),matriculeYear:val('myear'),receiptFooter:val('rfooter')}); log('Paramètres reçus modifiés'); save(); parametres()}
function addYear(){let y=val('newyear'); if(y&&!state.years.includes(y)){state.years.push(y);log('Année ajoutée : '+y);save();parametres()}}
function delYear(y){state.years=state.years.filter(x=>x!=y);log('Année supprimée : '+y);save();parametres()}
function saveOptions(){state.school.theme=val('theme');state.school.autoBackup=val('autob')==='true';state.school.keepBackups=Number(val('keepb'));log('Options modifiées');save();parametres()}
function sauvegardes(){view.innerHTML=`<div class="card"><h2>Sauvegardes et migration</h2><p>Les données de cette démo sont stockées dans le navigateur. Un autre utilisateur qui ouvre le lien aura sa propre base locale de test.</p><div class="btns"><button class="btn secondary" onclick="downloadJSON()">Télécharger sauvegarde JSON</button><button class="btn secondary" onclick="snapshot()">Créer snapshot local</button><button class="btn warn" onclick="resetDemo()">Réinitialiser la démo</button></div><br><label>Importer une sauvegarde JSON</label><input type="file" accept=".json" onchange="importJSON(this)"><h3>Snapshots locaux</h3><table><tr><th>Date</th><th>Élèves</th><th>Paiements</th><th>Action</th></tr>${(state.backups||[]).map((b,i)=>`<tr><td>${b.date}</td><td>${b.students}</td><td>${b.payments}</td><td><button class="btn light" onclick="restoreSnapshot(${i})">Restaurer</button></td></tr>`).join('')||'<tr><td colspan="4">Aucun snapshot</td></tr>'}</table></div>`}
function snapshot(){state.backups=state.backups||[]; state.backups.unshift({date:new Date().toLocaleString('fr-FR'),students:state.students.length,payments:state.payments.length,data:JSON.stringify({...state,backups:[]})}); state.backups=state.backups.slice(0,state.school.keepBackups||10); log('Snapshot local créé'); save(); sauvegardes()}
function restoreSnapshot(i){if(confirm('Restaurer ce snapshot ?')){let data=JSON.parse(state.backups[i].data); data.backups=state.backups; state=data; save(); log('Snapshot restauré'); drawApp()}}
function exportCSV(type){let rows=[]; if(type=='eleves')rows=[['matricule','nom','genre','naissance','classe','parent','contact','adresse','attendu','paye','reste'],...state.students.map(s=>[s.mat,s.nom,s.genre,s.birth,s.classe,s.parent,s.contact,s.address,due(s.id),paid(s.id),balance(s.id)])]; if(type=='paiements')rows=[['recu','eleve','matricule','montant','mode','date','caissier','note'],...state.payments.map(p=>[p.id,student(p.studentId).nom,student(p.studentId).mat,p.amount,p.mode,p.date,p.cashier,p.note])]; if(type=='inscriptions')rows=[['eleve','matricule','classe','annee','montant','remise','net','date'],...state.enrollments.map(e=>[student(e.studentId).nom,student(e.studentId).mat,e.classe,e.year,e.amount,e.discount||0,e.amount-(e.discount||0),e.date])]; let csv=rows.map(r=>r.map(x=>'"'+String(x??'').replaceAll('"','""')+'"').join(';')).join('\n'); download(type+'.csv',csv,'text/csv')}
function downloadJSON(){download('mienra-sauvegarde.json',JSON.stringify(state,null,2),'application/json')}
function download(name,content,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;a.click()}
function importJSON(input){let f=input.files[0]; if(!f)return; let r=new FileReader(); r.onload=()=>{try{state=JSON.parse(r.result); save(); log('Sauvegarde importée'); drawApp()}catch(e){alert('Fichier invalide')}}; r.readAsText(f)}
function resetDemo(){if(confirm('Réinitialiser toutes les données ?')){state=seed(); init(); save(); log('Démo réinitialisée'); drawApp()}}
showLogin();
</script>
</body>
</html>
